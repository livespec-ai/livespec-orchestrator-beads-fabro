# fast-forward-release-branch.yml — keep the `release` branch pinned to the
# latest release.
#
# Substrate for fleet plugin ref-pinning (livespec core epic livespec-c1k9,
# design plan/fleet-plugin-currency/research/design.md). The fleet's
# marketplace registrations pin each plugin entry to the `release` branch ref,
# which must always resolve to the latest published release commit. On every
# published release this fast-forwards `refs/heads/release` to the release
# tag's commit.
#
# Event: `release: published` — the same event release-dispatch.yml rides, and
# the release is authored via the App token (release-please.yml) so the event
# reliably fires.
#
# Auth: mints the livespec GitHub App installation token (secrets APP_ID +
# APP_PRIVATE_KEY), mirroring release-please.yml — the App identity that
# authors the release also advances the branch.
#
# The push is fast-forward-only: a plain `git push` (no --force) is rejected by
# the remote when `release` is not an ancestor of the released commit, failing
# the job loudly instead of silently rewriting the branch.

name: Fast-forward release branch

on:
  release:
    types: [published]
  # OPERATOR DISPATCH (bd-ib-sghxlk; spec v327; livespec-dev-tooling v155 option D). The
  # job below runs ONLY on this dispatch, so a published release no longer
  # moves `release` by itself: every fleet clone's SessionStart ensure-plugins
  # installs whatever `release` names, so `release` advances only when an
  # operator dispatches a tag, which starts that release's canary:
  #   gh workflow run fast-forward-release-branch.yml -f tag=vX.Y.Z
  # The `release: published` trigger above still fires; its job is skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to advance `release` to (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fast-forward-release-branch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # On a dispatch the checkout above has no release payload, so it checks
      # out the dispatched ref; this step moves HEAD to the tag the operator
      # names. The push below stays fast-forward-only, so a tag that does not
      # descend from the current `release` fails the run and moves nothing.
      - name: Check out the dispatched tag
        env:
          ROLL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/${ROLL_TAG}^{commit}" >/dev/null; then
            echo "roll tag ${ROLL_TAG} is not a tag of this repository" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/${ROLL_TAG}"
          echo "Roll tag ${ROLL_TAG} = $(git rev-parse HEAD)"

      # SPLIT-PAIR GATE (bd-ib-ozxhs4; spec v400, contracts.md "Revert and
      # reland coverage"). A tag can end between a revert and its reland: the
      # revert is in the tag, the reland is on master but not in the tag (the
      # 0.346.1 credential withdrawal shipped without the broker reland and
      # every proof comment failed). Before `release` moves, find each such
      # split pair and require the release's `canary-coverage.json` asset to
      # list it and to cover it with a successful journal citation of a canary
      # sample on the tag's commit. A tag holding both halves, or neither,
      # passes with no record. The step only adds a refusal: it never moves
      # `release` and never relaxes another check.
      - name: Refuse a tag that splits a revert from its reland without coverage
        env:
          ROLL_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          record="${RUNNER_TEMP}/canary-coverage.json"
          rm -f "$record"
          gh release download "$ROLL_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern canary-coverage.json --output "$record" \
            || echo "release ${ROLL_TAG} has no canary-coverage.json asset" >&2
          BASE_REF=origin/release MASTER_REF=origin/master COVERAGE_RECORD="$record" python3 - <<'SPLIT_PAIR_PY'
          import json
          import os
          import re
          import subprocess
          import sys

          SCOPE = ".claude-plugin/.fabro/workflows/"


          def git(*args, stdin=None, check=True):
              result = subprocess.run(
                  ["git", *args], capture_output=True, text=True, input=stdin, check=check
              )
              return result.stdout


          def commits(rng):
              for record in git("log", "--format=%H%x00%s%x00%B%x01", rng).split("\x01"):
                  record = record.strip("\n")
                  if record:
                      sha, subject, body = record.split("\x00", 2)
                      yield sha.strip(), subject, body


          def resolve(ref):
              out = subprocess.run(
                  ["git", "rev-parse", "--verify", "--quiet", ref + "^{commit}"],
                  capture_output=True,
                  text=True,
              )
              return out.stdout.strip()


          def patch_id(sha):
              out = git("patch-id", "--stable", stdin=git("show", sha)).split()
              return out[0] if out else ""


          def nodes_of(text):
              nodes, cur, buf = {}, None, []
              for line in text.splitlines():
                  if cur is None:
                      match = re.match(r"^    ([A-Za-z_]\w*) \[\s*$", line)
                      if match:
                          cur, buf = match.group(1), [line]
                  else:
                      buf.append(line)
                      if re.match(r"^    \]\s*$", line):
                          nodes[cur] = "\n".join(buf)
                          cur = None
              return nodes


          def required_nodes(reverted):
              """Nodes the reverted commit changed; proof_capture when it names none."""
              parent = reverted + "^"
              names = git("diff", "--name-only", parent, reverted, "--", SCOPE, check=False).split()
              required = set()
              for path in names:
                  if path.endswith("/workflow.fabro"):
                      old = nodes_of(git("show", parent + ":" + path, check=False))
                      new = nodes_of(git("show", reverted + ":" + path, check=False))
                      required |= {n for n in set(old) | set(new) if old.get(n) != new.get(n)}
                  else:
                      required.add("proof_capture")
              return required or {"proof_capture"}


          tag = os.environ["ROLL_TAG"]
          tip = git("rev-parse", "HEAD").strip()
          base = resolve(os.environ["BASE_REF"])
          master = resolve(os.environ["MASTER_REF"])
          reverts = []
          for sha, subject, body in commits(f"{base}..{tip}" if base else tip):
              match = re.search(r"^This reverts commit ([0-9a-f]{7,40})", body, re.M)
              match = match or re.match(r"^Revert\b.*?\b([0-9a-f]{12,40})\b", subject)
              reverted = resolve(match.group(1)) if match else ""
              if reverted:
                  reverts.append((sha, reverted))
          candidates = list(commits(f"{tip}..{master}")) if master else []


          def find_reland(reverted):
              for sha, _subject, body in candidates:
                  for found in re.finditer(r"^Relands:\s*([0-9a-f]{7,40})", body, re.M):
                      if reverted.startswith(found.group(1)) or found.group(1).startswith(reverted):
                          return sha
              pid = patch_id(reverted)
              for sha, _subject, _body in candidates:
                  if pid and patch_id(sha) == pid:
                      return sha
              return ""


          pairs = []
          for revert, reverted in reverts:
              reland = find_reland(reverted)
              if reland:
                  pairs.append(
                      {"revert": revert, "reverted": reverted, "reland": reland,
                       "required": sorted(required_nodes(reverted))}
                  )
          if not pairs:
              print(f"{tag}: no split revert/reland pair; nothing to cover")
              sys.exit(0)
          try:
              with open(os.environ["COVERAGE_RECORD"], encoding="utf-8") as handle:
                  record = json.load(handle)
          except (OSError, ValueError):
              record = {}
          listed = {
              p.get("revert"): p for p in record.get("split_pairs", []) if isinstance(p, dict)
          }
          uncovered = []
          for pair in pairs:
              entry = listed.get(pair["revert"])
              if entry is None:
                  uncovered.append((pair, "absent from canary-coverage.json"))
                  continue
              if (entry.get("reverted"), entry.get("reland")) != (pair["reverted"], pair["reland"]):
                  uncovered.append((pair, "the record names a different reverted or reland commit"))
                  continue
              done = {
                  c.get("node")
                  for c in entry.get("citations", [])
                  if isinstance(c, dict)
                  and c.get("build_commit") == tip
                  and c.get("outcome") == "success"
              }
              missing = [n for n in pair["required"] if n not in done]
              if missing:
                  uncovered.append(
                      (pair, "no successful citation on " + tip[:12] + " for " + ", ".join(missing))
                  )
          for pair, why in uncovered:
              print(
                  f"::error::{tag}: uncovered split pair, revert {pair['revert'][:12]} of "
                  f"{pair['reverted'][:12]} relanded by {pair['reland'][:12]}: {why}",
                  file=sys.stderr,
              )
          if uncovered:
              sys.exit(1)
          print(f"{tag}: {len(pairs)} split pair(s), each covered by a successful citation")
          SPLIT_PAIR_PY

      - name: Fast-forward the release branch to the released commit
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "Release ${{ github.event.release.tag_name }} = ${release_sha}"
          # Fast-forward-only: no --force, so the remote rejects (and this job
          # fails loudly) if `release` has diverged from the released history.
          git push origin "HEAD:refs/heads/release"
